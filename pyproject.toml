[project]
name = "scout"
version = "0.1.0"
description = "Robotics research radar for Auki Labs: ingests papers/repos/posts, enriches with an LLM, hybrid search via MCP + Discord."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "tenacity>=8.3",
  "feedparser>=6.0",
  "pyyaml>=6.0",
  "discord.py>=2.4",
  "mcp>=1.9",
  "anthropic>=0.70",
  "openai>=1.40",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "fastembed>=0.9.1",
]

[project.scripts]
scout = "scout.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "E741"]
per-file-ignores = {"evals/run.py" = ["E402"]}
