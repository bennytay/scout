name: ingest
# Hosted alternative to the bot's own monitor loop (use one or the other). X is the only scheduled source;
# arXiv / GitHub / Hugging Face are fetched when a kept post links to them.
# The schedule is off: the Discord bot scans X itself. When Scout is hosted (DATABASE_URL and API keys set as
# repo secrets), uncomment the schedule to scan from GitHub instead, and don't run the bot's monitor too.
on:
  # schedule:
  #   - cron: "17 */2 * * *"    # every 2h (X_EVERY_HOURS); each scan reads only posts since the last one
  workflow_dispatch:
    inputs:
      days: {description: "look-back days (backfill, max 7 for X recent search)", required: false, default: ""}
concurrency: {group: ingest, cancel-in-progress: false}
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  DISCORD_ALERTS_WEBHOOK_URL: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev && uv run scout migrate
      - run: uv run scout ingest ${{ inputs.days && format('--days {0}', inputs.days) || '' }}
  health:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --no-dev
      - run: uv run scout health --notify || true
