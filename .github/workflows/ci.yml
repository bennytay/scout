name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: {POSTGRES_USER: scout, POSTGRES_PASSWORD: scout, POSTGRES_DB: scout}
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U scout" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src tests evals
      - run: uv run pytest -q
      - name: eval (offline heuristic baseline, guards against search regressions)
        run: LLM_PROVIDER=fake EMBEDDING_PROVIDER=fake uv run python evals/run.py
